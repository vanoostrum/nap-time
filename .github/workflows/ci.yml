name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-linux:
    name: Core (Linux)
    # Swift 6.3 has no build for Ubuntu 26.04, which ubuntu-latest now is.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Cache Swift
        uses: actions/cache@v4
        with:
          path: ~/.local/share/swift
          # -v3: the install folder moved from swiftly to ~/.local/share/swift/<version> (CRAFT-58).
          key: swift-${{ runner.os }}-${{ hashFiles('.swift-version') }}-v3
      # The same script that installs Swift when a cloud agent runs scripts/verify.sh.
      - name: Install Swift from .swift-version
        run: |
          bash scripts/cloud-setup.sh
          echo "$HOME/.local/share/swift/$(tr -d '[:space:]' < .swift-version)/usr/bin" >> "$GITHUB_PATH"
      # The install must leave the checkout unchanged (CRAFT-42).
      - name: Check that the Swift install left the checkout clean
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "The Swift install changed the checkout:"
            echo "$changes"
            git diff
            exit 1
          fi
      - name: Check the Swift version
        run: swift --version | tee /dev/stderr | grep -F "Swift version $(cut -d. -f1,2 .swift-version)"
      - name: Lint
        run: swift format lint --strict --recursive .
      - name: Build Core
        run: swift build --package-path Packages/Core
      - name: Test Core
        run: swift test --package-path Packages/Core
      # A wrong skip would drop every UI test, so the change script has its own tests (ADR 0003).
      - name: Test the change script
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py'

  # Decides if the Screenshots job runs: a PR that changes only skip-list paths skips it (ADR 0003).
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      screenshots: ${{ steps.decide.outputs.screenshots }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Exits 1 when git cannot give the changed paths. Then Screenshots runs.
      - name: Decide if the Screenshots job runs
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_changes.py --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"

  app-ios:
    name: App (iOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode and simulator
        run: scripts/ci-select-xcode.sh >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Test NapTimeStore
        run: |
          set -o pipefail
          xcodebuild test -project NapTime.xcodeproj -scheme NapTime \
            -destination "id=$SIMULATOR_ID" -only-testing:NapTimeStoreTests \
            CODE_SIGNING_ALLOWED=NO
      - name: Test Core on iOS
        working-directory: Packages/Core
        run: |
          set -o pipefail
          xcodebuild -list
          scheme="$(xcodebuild -list -json | python3 -c 'import json,sys; s=json.load(sys.stdin)["workspace"]["schemes"]; print("Core-Package" if "Core-Package" in s else "Core")')"
          xcodebuild test -scheme "$scheme" -destination "id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO

  screenshots:
    name: Screenshots
    needs: changes
    # Runs unless Changes said "skip". When Changes fails, its output is empty, so the job runs.
    # !cancelled(), not always(): a run that a new push cancels does not start this job.
    if: ${{ !cancelled() && needs.changes.outputs.screenshots != 'skip' }}
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode and simulator
        run: scripts/ci-select-xcode.sh >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      # The boot takes about 3 minutes. It runs in the background while the app builds and xcodebuild starts.
      # As soon as it ends, the same background job fixes the status bar, so screenshots are the same
      # on every run (ADR 0003). xcodebuild installs the app only on a booted simulator, so this comes first.
      - name: Start to boot the simulator
        run: |
          mkdir -p build
          (
            xcrun simctl bootstatus "$SIMULATOR_ID" -b || { xcrun simctl boot "$SIMULATOR_ID"; xcrun simctl bootstatus "$SIMULATOR_ID" -b; }
            xcrun simctl status_bar "$SIMULATOR_ID" override --time "09:41" --dataNetwork wifi --wifiMode active \
              --wifiBars 3 --cellularMode notSupported --batteryState charged --batteryLevel 100
            echo "exit $? at $(date -u +%H:%M:%S)"
          ) < /dev/null > build/boot.log 2>&1 &
          echo "Booting $SIMULATOR_ID in the background, from $(date -u +%H:%M:%S)"
      # A generic destination, so xcodebuild does not wait for the booting simulator. arm64 only, as the simulator.
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project NapTime.xcodeproj -scheme NapTime \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build/DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO
      # A failed test runs once more. A test that passes on the retry passes, and gets a warning in the export step.
      - name: Run the UI tests
        id: uitests
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test-without-building -project NapTime.xcodeproj -scheme NapTime \
            -destination "id=$SIMULATOR_ID" -derivedDataPath build/DerivedData \
            -only-testing:NapTimeUITests -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath build/Screenshots.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Show the boot and status bar log
        if: always()
        run: cat build/boot.log
      - name: Export the screenshots
        if: always()
        run: python3 scripts/export-screenshots.py build/Screenshots.xcresult build/screenshots
      - name: Upload the screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: warn
      # The cloud agents cannot reach the artifact host, so the PNG files also go to a branch.
      - name: Push the screenshots to screenshots/<branch>
        if: always() && github.event.pull_request.head.repo.fork != true
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          mkdir -p "$dir/$HEAD_SHA"
          cp build/screenshots/* "$dir/$HEAD_SHA/" 2>/dev/null || true
          cd "$dir"
          git init -q -b screenshots
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q --allow-empty -m "Screenshots for $HEAD_SHA (run $GITHUB_RUN_ID)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/screenshots/${HEAD_BRANCH}"
          echo "Pushed to screenshots/${HEAD_BRANCH}: $(ls "$HEAD_SHA" | tr '\n' ' ')"
      - name: Fail when a UI test failed
        if: steps.uitests.outcome != 'success'
        run: |
          echo "The UI tests failed. See the step 'Run the UI tests'."
          exit 1
