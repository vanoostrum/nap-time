name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v swiftlint >/dev/null 2>&1 || brew install swiftlint
          xcodebuild -version; xcodegen --version; swiftlint version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: SwiftLint
        run: swiftlint --strict --reporter github-actions-logging

      - name: Core package tests
        run: swift test --package-path Packages/Core

      - name: Build & test app
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j | jq -r '[.devices[][]|select(.name|startswith("iPhone"))][0].udid')
          echo "Using simulator $SIM"
          xcodebuild test \
            -project NapTime.xcodeproj -scheme NapTime \
            -destination "id=$SIM" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/test-results.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results.xcresult
          retention-days: 7
