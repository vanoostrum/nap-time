name: Probe runners
on: pull_request
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-27, macos-latest, macos-26, macos-26-arm64]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - run: |
          sw_vers
          ls -d /Applications/Xcode*
          xcodebuild -version
          xcrun simctl list runtimes
