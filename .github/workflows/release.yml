# Uploads a build of `main` to TestFlight. Starts by hand, and waits for Theo's approval in the
# environment `testflight` (ADR 0009). Signs with automatic signing and an App Store Connect API key (ADR 0010).
# The build number is the run number. See "Release" in CLAUDE.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      schema_deployed:
        description: I deployed the CloudKit schema to production after the last model change (ADR 0011).
        type: boolean
        default: false

# One release at a time. A second run waits, and is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs before the approval, so a forgotten tick fails at once and never asks Theo to approve (ADR 0011).
  schema:
    name: Check the CloudKit schema
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Every commit and every tag, so the check finds the release tags.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fail when the model changed and the schema is not deployed
        env:
          SCHEMA_DEPLOYED: ${{ inputs.schema_deployed }}
        run: python3 scripts/schema_check.py

  release:
    name: Release to TestFlight
    needs: schema
    # Only from main, on top of the branch rule of `testflight`. From another branch, nothing asks for approval.
    if: github.ref == 'refs/heads/main'
    environment: testflight
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: scripts/ci-select-xcode.sh >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Archive, signed ad hoc
        run: scripts/release-archive.sh "$GITHUB_RUN_NUMBER" build/NapTime.xcarchive
      - name: Check the archive
        run: python3 scripts/release_check.py archive build/NapTime.xcarchive --build "$GITHUB_RUN_NUMBER" --signed
      # altool finds the key as AuthKey_<key id>.p8 in $API_PRIVATE_KEYS_DIR. The last step removes it.
      - name: Write the API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
      # Signs for App Store Connect with a cloud-managed distribution certificate. Writes the .ipa, uploads nothing.
      - name: Export and sign
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath build/NapTime.xcarchive -exportPath build/export \
            -exportOptionsPlist scripts/export-options.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      # Fails before the upload unless the app and the widget have the production entitlements.
      - name: Check the signed entitlements
        run: python3 scripts/release_check.py entitlements build/export/NapTime.ipa
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys" xcrun altool --upload-app --type ios \
            --file build/export/NapTime.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"

  # A separate job, so "Re-run failed jobs" after a failed tag push does not upload or ask for approval again.
  tag:
    name: Tag the release
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # An annotated tag on the run's commit. The line `schema-check: yes` marks it for the schema check of the next
      # release. A runner has no git identity, so the job sets one. Each `git tag -a` makes a new tag object, so a
      # re-run fails when this tag already reached GitHub; a failed push leaves none there.
      - name: Push the tag release/<build number>
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "release/$GITHUB_RUN_NUMBER" "$GITHUB_SHA" -m "Release $GITHUB_RUN_NUMBER" -m "schema-check: yes"
          git push origin "refs/tags/release/$GITHUB_RUN_NUMBER"
