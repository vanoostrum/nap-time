name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  testflight:
    name: TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      MATCH_GIT_URL: git@github.com:vanoostrum/nap-time-certificates.git
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Load match deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: fastlane beta
        run: bundle exec fastlane beta

      - name: Summary
        if: always()
        run: |
          if [ -f fastlane/build_info.txt ]; then
            echo "### TestFlight upload" >> "$GITHUB_STEP_SUMMARY"
            cat fastlane/build_info.txt >> "$GITHUB_STEP_SUMMARY"
          fi
