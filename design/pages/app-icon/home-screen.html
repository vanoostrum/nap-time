<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>App icon on the Home Screen</title>
<link rel="stylesheet" href="../../gallery.css">
</head>
<body>
<main class="screen home-screen">
<div class="icon-preview">
<div class="app-icon" style="--icon-size:180px"><svg class="icon-art" viewBox="0 0 100 100" role="img" aria-label="Nap Time app icon"><defs><filter id="big-blur" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><feGaussianBlur stdDeviation="5"/></filter><mask id="big-bite"><rect class="mask-keep" width="100" height="100"/><circle class="mask-bite" cx="65" cy="40" r="24"/></mask></defs><g filter="url(#big-blur)"><circle class="icon-glow" cx="52" cy="54" r="32" mask="url(#big-bite)"/></g><circle class="icon-moon" cx="52" cy="54" r="31" mask="url(#big-bite)"/><g class="icon-star" transform="translate(60 22) scale(0.7)"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.2l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></g><g class="icon-star" transform="translate(78 72) scale(0.5)"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.2l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></g><circle class="icon-dot" cx="20" cy="22" r="1.8"/><circle class="icon-dot" cx="88" cy="40" r="1.4"/><circle class="icon-dot" cx="14" cy="76" r="1.4"/></svg></div>
<p>Nap Time</p>
</div>
<div class="home-row">
<span class="home-app other" aria-hidden="true"><span class="app-icon"></span>Photos</span>
<a class="home-app" href="../home/day.html" aria-label="Open Nap Time"><span class="app-icon"><svg class="icon-art" viewBox="0 0 100 100" aria-hidden="true"><defs><filter id="small-blur" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><feGaussianBlur stdDeviation="5"/></filter><mask id="small-bite"><rect class="mask-keep" width="100" height="100"/><circle class="mask-bite" cx="65" cy="40" r="24"/></mask></defs><g filter="url(#small-blur)"><circle class="icon-glow" cx="52" cy="54" r="32" mask="url(#small-bite)"/></g><circle class="icon-moon" cx="52" cy="54" r="31" mask="url(#small-bite)"/><g class="icon-star" transform="translate(60 22) scale(0.7)"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.2l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></g><g class="icon-star" transform="translate(78 72) scale(0.5)"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.2l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></g><circle class="icon-dot" cx="20" cy="22" r="1.8"/><circle class="icon-dot" cx="88" cy="40" r="1.4"/><circle class="icon-dot" cx="14" cy="76" r="1.4"/></svg></span>Nap Time</a>
<span class="home-app other" aria-hidden="true"><span class="app-icon"></span>Clock</span>
<span class="home-app other" aria-hidden="true"><span class="app-icon"></span>Notes</span>
</div>
</main>
</body>
</html>
