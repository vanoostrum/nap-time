<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charts with no sleeps</title>
<link rel="stylesheet" href="../../gallery.css">
</head>
<body>
<main class="screen plain">
<header class="week-head">
<button class="round-arrow" aria-label="Previous week"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
<div class="title"><h1>Noah's week</h1><span>Mon 9 – Sun 15 Nov</span></div>
<button class="round-arrow" aria-label="Next week" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
</header>
<div class="stats">
<div class="stat"><span class="label">Average</span><span class="value">–</span><span class="note">range 10–13 h</span></div>
<div class="stat"><span class="label">In range</span><span class="value">–</span><span class="note">no sleeps yet</span></div>
</div>
<section class="card empty">
<h2>No sleeps this week</h2>
<p>Log Noah's sleeps on the Today tab, or add one from earlier.</p>
<button class="primary">Add a sleep</button>
</section>
<nav class="layer tabs"><a class="tab" href="../home/day.html">Today</a><a class="tab current" href="../charts/week.html">Charts</a></nav>
</main>
</body>
</html>
