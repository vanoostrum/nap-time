<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charts for this week, today so far</title>
<link rel="stylesheet" href="../../gallery.css">
</head>
<body>
<main class="screen plain">
<header class="week-head">
<button class="round-arrow" aria-label="Previous week"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
<div class="title"><h1>Mila's week</h1><span>Mon 9 – Sun 15 Nov</span></div>
<button class="round-arrow" aria-label="Next week" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
</header>
<div class="stats">
<div class="stat"><span class="label">Average</span><span class="value">11 h 27 m</span><span class="note">range 11–14 h</span></div>
<div class="stat"><span class="label">In range</span><span class="value">1 of 2 days</span><span class="note">bed ~19:50 · up ~06:30</span></div>
</div>
<section class="card">
<h2>Hours per day</h2>
<div class="bars"><div class="band" style="--lo:11;--hi:14" aria-hidden="true"></div>
<button class="bar" style="--h:12.25" aria-label="Monday 9 Nov, 12 h 15 m"></button>
<button class="bar little" style="--h:10.65" aria-label="Tuesday 10 Nov, 10 h 39 m"></button>
<button class="bar so-far" style="--h:10.83" aria-label="Wednesday 11 Nov, 10 h 50 m so far"></button>
</div>
<div class="days"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
<div class="legend"><span><i></i>in range</span><span><i class="little"></i>too little</span><span><i class="much"></i>too much</span><span><i class="so-far"></i>so far</span></div>
</section>
<section class="card">
<h2>When Mila slept</h2>
<button class="row" aria-label="Monday 9 Nov details"><span class="d">Mon</span><span class="track"><span class="seg" style="--from:1.75;--len:10.75"></span><span class="seg nap" style="--from:19;--len:1.5"></span></span></button>
<button class="row" aria-label="Tuesday 10 Nov details"><span class="d">Tue</span><span class="track"><span class="seg" style="--from:2.5;--len:9.75"></span><span class="seg nap" style="--from:19.5;--len:0.9"></span></span></button>
<button class="row" aria-label="Wednesday 11 Nov details"><span class="d">Wed</span><span class="track"><span class="seg" style="--from:1.83;--len:10.83"></span></span></button>
<div class="axis"><span>18:00</span><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span></div>
</section>
<nav class="layer tabs"><a class="tab" href="../home/day.html">Today</a><a class="tab current" href="../charts/week.html">Charts</a></nav>
</main>
</body>
</html>
