<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add another child</title>
<link rel="stylesheet" href="../../gallery.css">
</head>
<body>
<main class="screen plain">
<header class="form-head"><span class="text-button">Cancel</span><h1>Add a child</h1><span class="text-button"></span></header>
<button class="photo-pick" aria-label="Add a photo"><span class="photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><span>Add a photo (optional)</span></button>
<div class="field"><label for="name">Name</label><input id="name" value="Noah"></div>
<div class="field"><span class="label">Birthdate</span><span class="value">10 February 2026 <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span><span class="hint">Noah is 4 months old. The range is 12–16 h of sleep a day.</span></div>
<button class="primary">Add Noah</button>
<div class="tabs" aria-hidden="true"></div>
</main>
</body>
</html>
