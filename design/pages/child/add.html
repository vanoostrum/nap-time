<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add your child</title>
<link rel="stylesheet" href="../../gallery.css">
</head>
<body>
<main class="screen plain">
<header class="form-head"><h1>Add your child</h1></header>
<button class="photo-pick" aria-label="Add a photo"><span class="photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><span>Add a photo (optional)</span></button>
<div class="field"><label for="name">Name</label><input id="name" value="Mila"></div>
<div class="field"><span class="label">Birthdate</span><span class="value">12 March 2025 <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span><span class="hint">Mila is 1 year old. Her range is 11–14 h of sleep a day.</span></div>
<button class="primary">Add Mila</button>
<div class="tabs" aria-hidden="true"></div>
</main>
</body>
</html>
