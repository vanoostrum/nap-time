<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit child</title>
<link rel="stylesheet" href="../../gallery.css">
</head>
<body>
<main class="screen plain">
<header class="form-head"><span class="text-button">Cancel</span><h1>Edit child</h1><span class="text-button"></span></header>
<button class="photo-pick" aria-label="Change the photo"><span class="photo filled">M</span><span>Change photo</span></button>
<div class="field"><label for="name">Name</label><input id="name" value="Mila"></div>
<div class="field"><span class="label">Birthdate</span><span class="value">12 March 2025 <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span><span class="hint">Mila is 1 year old. The range is 11–14 h of sleep a day.</span></div>
<button class="primary">Save</button>
<button class="danger">Delete Mila</button>
<div class="tabs" aria-hidden="true"></div>
</main>
</body>
</html>
