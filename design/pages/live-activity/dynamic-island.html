<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamic Island sleep timer</title>
<link rel="stylesheet" href="../../gallery.css">
</head>
<body>
<main class="lock unlocked">
<h2>Compact</h2>
<div class="island" role="img" aria-label="Compact: Mila sleeping 8:28:14"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.6 6.6 0 0 0 10.7 10.7z"/></svg><span>8:28:14</span></div>
<p class="caption">One timer runs</p>
<h2>Minimal</h2>
<div class="island minimal" role="img" aria-label="Minimal: Mila's timer next to another Live Activity"><span class="dot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.6 6.6 0 0 0 10.7 10.7z"/></svg></span><span class="pill"></span></div>
<p class="caption">Two timers run: Noah's is the other one</p>
<h2>Expanded</h2>
<div class="island-expanded">
<div class="top"><span class="avatar">M</span><span class="who">Mila is sleeping</span><span class="timer">8:28:14</span></div>
<div class="bottom"><span class="since">since 19:42</span><button>Awake</button></div>
</div>
<p class="caption">Touch and hold the island</p>
</main>
</body>
</html>
