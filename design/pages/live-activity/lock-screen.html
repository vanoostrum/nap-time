<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lock Screen Live Activity</title>
<link rel="stylesheet" href="../../gallery.css">
</head>
<body>
<main class="lock">
<span class="clock">04:10</span>
<span class="date">Tuesday 17 November</span>
<div class="activity">
<span class="avatar">M</span>
<div class="what"><span class="who">Mila is sleeping</span><span class="timer">8:28:14</span><span class="since">since 19:42</span></div>
<button>Awake</button>
</div>
<div class="island" role="img" aria-label="Dynamic Island: Mila sleeping 8:28:14"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.6 6.6 0 0 0 10.7 10.7z"/></svg><span>8:28:14</span></div>
<p class="caption">Dynamic Island, on phones that have one</p>
<p class="note">A night's timer shows from 04:00 until wake-up, without a sound. It counts from bedtime.</p>
</main>
</body>
</html>
