<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lock Screen nap timer</title>
<link rel="stylesheet" href="../../gallery.css">
</head>
<body>
<main class="lock">
<span class="clock">13:50</span>
<span class="date">Monday 16 November</span>
<div class="activity nap">
<span class="avatar">M</span>
<div class="what"><span class="who">Mila is sleeping</span><span class="timer">45:12</span><span class="since">since 13:05</span></div>
<button>Awake</button>
</div>
<div class="island nap" role="img" aria-label="Dynamic Island: Mila napping 45:12"><svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>45:12</span></div>
<p class="caption">Dynamic Island, on phones that have one</p>
<p class="note">A nap's timer shows at once, when you tap "Nap time".</p>
</main>
</body>
</html>
