<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit a sleep</title>
<link rel="stylesheet" href="../../gallery.css">
</head>
<body>
<main class="screen plain">
<header class="form-head"><button class="text-button">Cancel</button><h1>Edit sleep</h1><span class="text-button" aria-hidden="true"></span></header>
<div class="field"><span class="label">Type</span><div class="segmented"><button aria-pressed="true">Night</button><button aria-pressed="false">Nap</button></div></div>
<div class="field"><span class="label">Fell asleep</span><span class="value">Mon 2 Nov · 20:54 <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span></div>
<div class="field"><span class="label">Woke up</span><span class="value">Tue 3 Nov · 06:12 <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span><span class="hint">9 h 18 m of sleep</span></div>
<button class="primary">Save</button>
<button class="danger">Delete this sleep</button>
<div class="tabs" aria-hidden="true"></div>
</main>
</body>
</html>
