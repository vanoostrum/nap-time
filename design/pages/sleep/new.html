<!doctype html>

<title>Add a sleep</title>

<main class="screen plain">

<div class="field"><span class="label">Woke up</span><span class="value">Tue 10 Nov · 14:20 <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span><span class="hint">1 h 15 m of sleep</span></div>

<div class="tabs" aria-hidden="true"></div>
