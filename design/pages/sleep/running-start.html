<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Edit sleep</title>
<link rel="stylesheet" href="../../gallery.css">
</head>
<body>
<main class="screen plain">
<header class="form-head"><span class="text-button">Cancel</span><h1>Edit sleep</h1><span class="text-button"></span></header>
<div class="field"><span class="label">Type</span><div class="segmented"><button aria-pressed="true">Night</button><button aria-pressed="false">Nap</button></div></div>
<div class="field"><span class="label">Fell asleep</span><span class="value">Mon 9 Nov · 19:20 <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span><span class="hint">Saving keeps the sleep running.</span></div>
<div class="field"><span class="label">Woke up</span><span class="value">Still asleep</span><span class="hint">2 h 36 m so far</span></div>
<button class="primary">Save</button>
<div class="tabs" aria-hidden="true"></div>
</main>
