name: NapTime
options:
  bundleIdPrefix: nl.clearblocks
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: 2SUL28U5Y7
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Core:
    path: Packages/Core
targets:
  NapTime:
    type: application
    platform: iOS
    sources:
      - App
      # The sleep timer's attributes and views, and "Awake" (CRAFT-51).
      - Widget/Shared
      - Widget/Intent
    dependencies:
      - package: Core
      - target: NapTimeStore
      - target: NapTimeWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nap Time
        # XcodeGen writes 1.0 and 1 unless told. The build settings carry the version and the run number (CRAFT-76).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIAppFonts: [Baloo2-SemiBold.ttf, Baloo2-Bold.ttf, Baloo2-ExtraBold.ttf]
        NSSupportsLiveActivities: true
        # Opened invite links reach the app (CRAFT-50).
        CKSharingSupported: true
        # The partner's changes arrive in the background through CloudKit pushes.
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Portrait only, so App Store Connect needs this, or it rejects the upload (error 90474, CRAFT-76).
        UIRequiresFullScreen: true
        # The app uses only the encryption of iOS, so TestFlight asks no export question (CRAFT-76).
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/NapTime.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers: [iCloud.nl.clearblocks.naptime]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.nl.clearblocks.naptime]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.clearblocks.naptime
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  NapTimeWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      # Baloo 2, so the sleep timer uses the gallery's font.
      - App/Fonts
    dependencies:
      - package: Core
      - target: NapTimeStore
        embed: false
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Nap Time
        # XcodeGen writes 1.0 and 1 unless told. The build settings carry the version and the run number (CRAFT-76).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [Baloo2-SemiBold.ttf, Baloo2-Bold.ttf, Baloo2-ExtraBold.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/NapTimeWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.nl.clearblocks.naptime]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.clearblocks.naptime.widget
  NapTimeStore:
    type: framework
    platform: iOS
    sources:
      - Store
    dependencies:
      - package: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.clearblocks.naptime.store
        GENERATE_INFOPLIST_FILE: YES
  NapTimeStoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StoreTests
    dependencies:
      - target: NapTimeStore
      - package: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.clearblocks.naptime.storetests
        GENERATE_INFOPLIST_FILE: YES
  NapTimeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      # The sleep timer's views, rendered with ImageRenderer (ADR 0003), and Baloo 2 for them. Not EndSleepIntent.
      - Widget/Shared
      - App/Fonts
    dependencies:
      - package: Core
      - target: NapTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.clearblocks.naptime.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NapTime
schemes:
  NapTime:
    build:
      targets:
        NapTime: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NapTimeStoreTests
        - NapTimeUITests
