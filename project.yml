name: NapTime
options:
  bundleIdPrefix: nl.clearblocks
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set by fastlane (match) in CI; locally via Xcode
packages:
  Core:
    path: Packages/Core
targets:
  NapTime:
    type: application
    platform: iOS
    sources:
      - NapTime/Sources
      - NapTime/Resources
    dependencies:
      - package: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.clearblocks.naptime
        PRODUCT_NAME: NapTime
        INFOPLIST_KEY_CFBundleDisplayName: Nap Time
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  NapTimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NapTimeTests
    dependencies:
      - target: NapTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.clearblocks.naptime.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NapTime:
    build:
      targets:
        NapTime: all
        NapTimeTests: [test]
    test:
      targets:
        - NapTimeTests
        - package: Core/CoreTests
      gatherCoverageData: true
